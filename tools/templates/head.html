<!--build:head-->
    <link rel="canonical" href="{{CANONICAL}}">
    <meta name="author" content="Pogo">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8f0fe">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
    <meta property="og:site_name" content="{{SITE_NAME}}">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:type" content="{{OGTYPE}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESC}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{OG_ALT}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESC}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/images/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="alternate" type="application/atom+xml" title="{{SITE_NAME}}" href="{{SITE}}/atom.xml">
    <script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.classList.add("dark")}}catch(e){}})();</script>
    <script type="application/ld+json">{{JSONLD}}</script>
<!--/build:head-->
